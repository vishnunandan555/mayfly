name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Verify zero dependencies
        run: |
          DEPS=$(go list -m all | tail -n +2)
          if [ -n "$DEPS" ]; then
            echo "ERROR: external dependencies detected:"
            echo "$DEPS"
            exit 1
          fi
          echo "Zero external dependencies confirmed."
        shell: bash

      - name: Vet
        run: go vet ./...

      - name: Test (Linux & Windows)
        if: matrix.os != 'macos-latest'
        run: go test -race -timeout 180s ./...

      - name: Test (macOS)
        if: matrix.os == 'macos-latest'
        run: go test -timeout 180s ./...



  build-matrix:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64   }
          - { goos: linux,   goarch: arm64   }
          - { goos: darwin,  goarch: amd64   }
          - { goos: darwin,  goarch: arm64   }
          - { goos: windows, goarch: amd64   }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true


      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w -buildid=" -o /dev/null ./cmd/mayfly
